<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسياد الكوبي ♠️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header>
        <div class="logo">♠️</div>
        <h1>أسياد الكوبي</h1>
        <p>إدارة نقاط لعبة الكوبي</p>
    </header>


    <section class="setup">

        <h2>إعداد لعبة جديدة</h2>

        <div class="players">

            <input id="player1" placeholder="اللاعب 1">
            <input id="player2" placeholder="اللاعب 2">
            <input id="player3" placeholder="اللاعب 3">
            <input id="player4" placeholder="اللاعب 4">

        </div>


        <h3>حد الفوز</h3>

        <div class="win-options">

            <button>25</button>
            <button class="active">30</button>
            <button>50</button>

        </div>


        <button class="start">
            ابدأ اللعبة ♠️
        </button>

    </section>
    <section class="game" id="gameScreen" style="display:none;">

    <h2>الجولة <span id="roundNumber">1</span> ♠️</h2>

    <div id="playersArea"></div>

    <button class="nextRound">
        إنهاء الجولة
    </button>

    </section>

</div>


<script src="script.js"></script>

</body>
</html>
